<svg xmlns="http://www.w3.org/2000/svg" width="360" height="40" viewBox="0 0 360 40" role="img" aria-labelledby="title desc">
  <title id="title">Exploring AI. Building ideas.</title>
  <desc id="desc">Ryan's slogan, revealed one character at a time. Reduced motion shows the complete sentence.</desc>
  <style>
    .line {
      fill: #59636e;
      font-family: ui-monospace, SFMono-Regular, Consolas, "Liberation Mono", monospace;
      font-size: 18px;
    }
    .reveal {
      transform-origin: 0 0;
      animation: typing 7.2s steps(29, end) infinite;
    }
    .cursor {
      fill: #2450ea;
      animation: cursor-travel 7.2s steps(29, end) infinite, blink 0.8s step-end infinite;
    }
    @keyframes typing {
      0%, 5% { transform: scaleX(0); }
      45%, 83% { transform: scaleX(1); }
      98%, 100% { transform: scaleX(0); }
    }
    @keyframes cursor-travel {
      0%, 5% { transform: translateX(0); }
      45%, 83% { transform: translateX(313.2px); }
      98%, 100% { transform: translateX(0); }
    }
    @keyframes blink {
      0%, 49% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }
    @media (prefers-color-scheme: dark) {
      .line { fill: #b6c2cf; }
      .cursor { fill: #82a0ff; }
    }
    @media (prefers-reduced-motion: reduce) {
      .reveal { animation: none; transform: none; }
      .cursor { animation: none; opacity: 0; }
    }
  </style>
  <defs>
    <clipPath id="typing-clip"><rect class="reveal" width="313.2" height="40" /></clipPath>
  </defs>
  <g transform="translate(23.4 0)">
    <text class="line" x="0" y="26" textLength="313.2" lengthAdjust="spacingAndGlyphs" clip-path="url(#typing-clip)">Exploring AI. Building ideas.</text>
    <rect class="cursor" x="1" y="10" width="2" height="20" rx="1" />
  </g>
</svg>
